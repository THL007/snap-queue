<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Snap Queue</title>
    <meta name="description" content="Every Snapchat chat in one queue, sorted by whose move it is." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f7f4ec" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Snap Queue" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <style id="expo-reset">
      #root { display: block; min-height: 100%; }
    </style>
  </head>
  <body>
    <noscript>Snap Queue needs JavaScript to load your chats.</noscript>
    <div id="root"></div>
    <script>
      if ("serviceWorker" in navigator && location.hostname !== "localhost") {
        window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js"); });
      }
    </script>
  </body>
</html>
